# neurath:checkout-bootstrap
model_context_window = 1000000
model_auto_compact_token_limit = 900000
model_reasoning_summary = "detailed"
model_verbosity = "high"

[features]
multi_agent = true
multi_agent_v2 = true

[agents]
enabled = true
max_concurrent_threads_per_session = 6

[tools.update_plan]
enabled = true













































































































































[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_ENABLE_TODO_TOOLS = "1"
CLAUDE_CODE_ENABLE_TASKS = "0"

[mcp_servers.neurath_collaboration]
command = "sh"
args = ["-c", "exec \"$(git rev-parse --show-toplevel)/tools/checkout_host\" mcp"]
tool_timeout_sec = 3660
startup_timeout_sec = 600
enabled_tools = ["harness_bypass", "session_status", "provider_run", "provider_status", "provider_cancel", "provider_recover", "provider_capabilities", "provider_route", "memory_recall", "memory_pull", "memory_checkpoint", "verification_run", "collaboration_discover", "collaboration_inbox", "collaboration_send", "collaboration_reply", "collaboration_message", "collaboration_ack", "collaboration_forward", "collaboration_submitted", "collaboration_assign", "collaboration_accept", "collaboration_report", "collaboration_task", "newsroom_headlines", "newsroom_read", "newsroom_publish", "artifact_put", "artifact_read", "session_inspect", "turn_inspect", "worktree_inspect", "worktree_claim", "worktree_release", "material_prepare", "material_read", "material_resolve", "material_abandon", "learning_status", "learning_pending", "releases_status", "reporting_status", "reporting_list", "learning_history", "learning_defer", "reporting_read", "releases_check", "maintenance_choice_read", "maintenance_choice_prepare", "releases_notice", "releases_recover", "releases_prepare", "releases_apply", "reporting_prepare", "reporting_submit", "reporting_reconcile", "reporting_consent", "reporting_approve", "releases_choose", "provider_models", "provider_plan", "provider_plan_read", "workflow_start", "workflow_advance", "workflow_finalize", "phase_start", "phase_current", "phase_evidence_prepare", "phase_complete", "phase_finalize", "adaptive_read", "adaptive_preflight", "adaptive_replace", "adaptive_override_goal", "delegation_prepare", "delegation_assign", "evaluation_prepare", "evaluation_read", "evaluation_execute", "evaluation_report", "evaluation_consume", "collaboration_register", "collaboration_conversation", "collaboration_close", "collaboration_subscribe", "collaboration_unsubscribe", "collaboration_publish", "newsroom_revise", "newsroom_comment", "newsroom_peers", "newsroom_seen", "diagnostics_integrity", "diagnostics_project", "diagnostics_profile", "enclave_read", "enclave_set",