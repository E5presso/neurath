# neurath:checkout-bootstrap
model_context_window = 1000000
model_auto_compact_token_limit = 900000
model_reasoning_summary = "detailed"
model_verbosity = "high"
[features]
multi_agent = true
multi_agent_v2 = true
[agents]
enabled = true
max_concurrent_threads_per_session = 6
[tools.update_plan]
enabled = true
[shell_environment_policy]
inherit = "core"
[shell_environment_policy.set]
CLAUDE_CODE_ENABLE_TODO_TOOLS = "1"
CLAUDE_CODE_ENABLE_TASKS = "0"

[mcp_servers.neurath_collaboration]
command = "sh"
args = ["-c", "exec \"$(git rev-parse --show-toplevel)/tools/checkout_host\" mcp --provider codex"]
startup_timeout_sec = 600
enabled_tools = ["approval_record", "assignment_accept", "assignment_cancel", "assignment_prepare", "assignment_read", "assignment_reject", "assignment_report", "assignment_start", "collaboration_ack", "collaboration_discover", "collaboration_inbox", "collaboration_reply", "collaboration_send", "evidence_list", "learning_pending", "learning_status", "memory_checkpoint", "memory_pull", "memory_recall", "newsroom_headlines", "newsroom_publish", "newsroom_read", "phase_complete", "phase_read", "phase_restart", "provider_prepare", "provider_read", "publication_read", "report_record", "session_status", "skill_start", "source_list", "source_quote", "source_read", "source_restore", "task_adopt", "task_complete", "task_define", "task_focus", "task_list", "task_read", "task_resume", "task_start", "task_wait", "task_withdraw", "verification_prepare", "verification_read", "worktree_claim", "worktree_read", "worktree_release"]
