[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neurath"
version = "0.3.1"
description = "Evidence-preserving agent work orchestration"
requires-python = ">=3.14,<3.15"
dependencies = [
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    "spakky==8.1.0",
    "spakky-data==8.1.0",
    "spakky-domain==8.1.0",
    "spakky-sqlalchemy==8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
    "build>=1.2",
    "pre-commit>=4.5",
    "pyrefly>=1.3.2",
    "pydoclint>=0.11.1",
    "pytest-cov>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neurath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --tb=short"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pyrefly]
python-version = "3.14"
preset = "strict"
project-includes = ["src/**/*.py", "tools/**/*.py"]
search-path = ["src", "."]
check-unannotated-defs = true
infer-return-types = "never"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
skip-checking-short-docstrings = false
allow-init-docstring = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "ANN", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]

[tool.coverage.run]
branch = true
source = ["src/neurath"]
data_file = "coverage-out/.coverage"

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
