[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neurath"
version = "0.4.1"
description = "Evidence-preserving agent work orchestration"
requires-python = ">=3.14,<3.15"
dependencies = [
    "sqlalchemy[asyncio]==2.0.54",
    "aiosqlite>=0.22.1",
    "alembic==1.20.0",
    "spakky==8.2.0",
    "spakky-data==8.2.0",
    "spakky-domain==8.2.0",
    "spakky-sqlalchemy==8.2.0",
    "spakky-typer==8.2.0",
    "spakky-event==8.2.0",
    "ijson>=3.4,<4",
]

[project.scripts]
neurath = "neurath.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
    "build>=1.2",
    "pre-commit>=4.5",
    "pyrefly>=1.3.2",
    "pydoclint>=0.11.1",
    "pytest-cov>=7",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8,<4",
    "pytest-split>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neurath"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["error::RuntimeWarning", "error::pytest.PytestUnraisableExceptionWarning"]
testpaths = ["tests"]
addopts = "--import-mode=importlib --tb=short"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pyrefly]
python-version = "3.14"
preset = "strict"
project-includes = ["src/**/*.py", "tools/**/*.py"]
search-path = ["src", "."]
check-unannotated-defs = true
infer-return-types = "never"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
skip-checking-short-docstrings = false
allow-init-docstring = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "ANN", "UP"]
extend-select = ["RET505", "RET506", "RET507", "RET508"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]

[tool.coverage.run]
branch = true
source = ["src/neurath"]
data_file = "coverage-out/.coverage"

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true
