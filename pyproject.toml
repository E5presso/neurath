[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neurath"
version = "0.3.0"
description = "Evidence-preserving agent work orchestration"
requires-python = ">=3.14,<3.15"
dependencies = ["SQLAlchemy==2.0.54", "alembic==1.20.0"]

[project.scripts]
neurath = "neurath.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.15", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/neurath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --tb=short"

[tool.ruff]
target-version = "py314"
line-length = 100
