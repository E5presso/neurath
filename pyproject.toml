[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neurath"
version = "0.3.1"
description = "Evidence-preserving agent work orchestration"
requires-python = ">=3.14,<3.15"
dependencies = ["SQLAlchemy==2.0.54", "alembic==1.20.0"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.15", "build>=1.2", "mypy>=1.19", "pre-commit>=4.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/neurath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --tb=short"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/neurath", "tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "ANN"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]
