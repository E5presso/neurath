<title id="title">Neurath harness architecture</title><desc id="desc">Connect intent, verify authority, preserve execution evidence. Conceptual responsibility map. Placement does not imply processes or call order.</desc>
<style>text{font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#15243b}.label{font-size:17px;font-weight:700;letter-spacing:1px}.head{font-size:23px;font-weight:700}.body{font-size:16px;fill:#43556b}</style>
<rect width="1440" height="1240" rx="24" fill="#f7f9fc"/><rect width="1440" height="170" rx="24" fill="#14263f"/>
<text x="60" y="73" style="font-size:44px;font-weight:700;fill:white">Neurath harness architecture</text>
<text x="62" y="120" style="font-size:23px;fill:#c8d7e9">Connect intent, verify authority, preserve execution evidence</text><text x="62" y="205" class="label">01  USER AND PROJECT</text><rect x="60" y="223" width="430" height="130" rx="15" fill="#e8f1ff" stroke="#cfdae6"/><rect x="79" y="245" width="5" height="72" rx="2" fill="#486c9d"/><text x="100" y="262" class="head">Current user intent</text><text x="100" y="294" class="body">Goals · constraints · acceptance</text><text x="100" y="322" class="body">Project instructions and authorization</text><rect x="505" y="223" width="430" height="130" rx="15" fill="#e8f1ff" stroke="#cfdae6"/><rect x="524" y="245" width="5" height="72" rx="2" fill="#486c9d"/><text x="545" y="262" class="head">Native host</text><text x="545" y="294" class="body">Codex · Claude Code</text><text x="545" y="322" class="body">Actual sessions, turns, tool events</text><rect x="950" y="223" width="430" height="130" rx="15" fill="#e8f1ff" stroke="#cfdae6"/><rect x="969" y="245" width="5" height="72" rx="2" fill="#486c9d"/><text x="990" y="262" class="head">Agent judgment</text><text x="990" y="294" class="body">Read context and select procedures</text><text x="990" y="322" class="body">Execute and follow up within scope</text><path d="M720 359v20m-6-6 6 6 6-6" fill="none" stroke="#8399b0" stroke-width="2"/><text x="62" y="393" class="label">02  GUIDANCE AND AUTHORITY</text><rect x="60" y="411" width="430" height="130" rx="15" fill="#e5f5ef" stroke="#cfdae6"/><rect x="79" y="433" width="5" height="72" rx="2" fill="#486c9d"/><text x="100" y="450" class="head">Policy and skills</text><text x="100" y="482" class="body">Intent routing · work procedures</text><text x="100" y="510" class="body">Public skills and executable contracts</text><rect x="505" y="411" width="430" height="130" rx="15" fill="#e5f5ef" stroke="#cfdae6"/><rect x="524" y="433" width="5" height="72" rx="2" fill="#486c9d"/><text x="545" y="450" class="head">Identity and ownership</text><text x="545" y="482" class="body">SessionKernel · StateHandle</text><text x="545" y="510" class="body">Call binding · worktree ownership</text><rect x="950" y="411" width="430" height="130" rx="15" fill="#e5f5ef" stroke="#cfdae6"/><rect x="969" y="433" width="5" height="72" rx="2" fill="#486c9d"/><text x="990" y="450" class="head">Named MCP tasks</text><text x="990" y="482" class="body">Structured inputs and domain dispatch</text><text x="990" y="510" class="body">Execution under current policy</text><path d="M720 547v20m-6-6 6 6 6-6" fill="none" stroke="#8399b0" stroke-width="2"/><text x="62" y="581" class="label">03  TASKS AND DOMAIN SERVICES</text><rect x="60" y="599" width="430" height="130" rx="15" fill="#eef0fc" stroke="#cfdae6"/><rect x="79" y="621" width="5" height="72" rx="2" fill="#486c9d"/><text x="100" y="638" class="head">State and material effects</text><text x="100" y="670" class="body">Phase transitions · material actions</text><text x="100" y="698" class="body">Baseline → outcome → reconciliation</text><rect x="505" y="599" width="430" height="130" rx="15" fill="#eef0fc" stroke="#cfdae6"/><rect x="524" y="621" width="5" height="72" rx="2" fill="#486c9d"/><text x="545" y="638" class="head">Providers and messages</text><text x="545" y="670" class="body">Model plans · inherited policy · ownership</text><text x="545" y="698" class="body">Persist → deliver → ACK</text><rect x="950" y="599" width="430" height="130" rx="15" fill="#eef0fc" stroke="#cfdae6"/><rect x="969" y="621" width="5" height="72" rx="2" fill="#486c9d"/><text x="990" y="638" class="head">Maintenance</text><text x="990" y="670" class="body">Updates · reports · contributions</text><text x="990" y="698" class="body">Exact target · user choice · recovery</text><path d="M720 735v20m-6-6 6 6 6-6" fill="none" stroke="#8399b0" stroke-width="2"/><text x="62" y="769" class="label">04  VERIFICATION AND CONTINUITY</text><rect x="60" y="787" width="430" height="130" rx="15" fill="#fff2dc" stroke="#cfdae6"/><rect x="79" y="809" width="5" height="72" rx="2" fill="#486c9d"/><text x="100" y="826" class="head">Independent evaluation</text><text x="100" y="858" class="body">Candidate · source revision · evaluator</text><text x="100" y="886" class="body">Report → owner consumption → gates</text><rect x="505" y="787" width="430" height="130" rx="15" fill="#fff2dc" stroke="#cfdae6"/><rect x="524" y="809" width="5" height="72" rx="2" fill="#486c9d"/><text x="545" y="826" class="head">Context and learning</text><text x="545" y="858" class="body">Shared memory · Enclave · Graphify</text><text x="545" y="886" class="body">Validate → trial → retain or revert</text><rect x="950" y="787" width="430" height="130" rx="15" fill="#fff2dc" stroke="#cfdae6"/><rect x="969" y="809" width="5" height="72" rx="2" fill="#486c9d"/><text x="990" y="826" class="head">Verification scopes</text><text x="990" y="858" class="body">Distribution · installation · tests · host</text><text x="990" y="886" class="body">Separate what each result establishes</text><path d="M720 923v20m-6-6 6 6 6-6" fill="none" stroke="#8399b0" stroke-width="2"/><text x="62" y="957" class="label">05  STORAGE AND DISTRIBUTION</text><rect x="60" y="975" width="430" height="130" rx="15" fill="#ecf2f7" stroke="#cfdae6"/><rect x="79" y="997" width="5" height="72" rx="2" fill="#486c9d"/><text x="100" y="1014" class="head">Target worktree</text><text x="100" y="1046" class="body">User source and development environment</text><text x="100" y="1074" class="body">Document and check bindings</text><rect x="505" y="975" width="430" height="130" rx="15" fill="#ecf2f7" stroke="#cfdae6"/><rect x="524" y="997" width="5" height="72" rx="2" fill="#486c9d"/><text x="545" y="1014" class="head">Private local records</text><text x="545" y="1046" class="body">State · messages · memory · install history</text><text x="545" y="1074" class="body">Source-labelled and owner-bound</text><rect x="950" y="975" width="430" height="130" rx="15" fill="#ecf2f7" stroke="#cfdae6"/><rect x="969" y="997" width="5" height="72" rx="2" fill="#486c9d"/><text x="990" y="1014" class="head">Independent package</text><text x="990" y="1046" class="body">Owned assets · SHA-256 manifest</text><text x="990" y="1074" class="body">Conservative install · journal · recovery</text><path d="M60 1150h1320" stroke="#ccd6e2"/><text x="62" y="1181" class="body">Conceptual responsibility map. Placement does not imply processes or call order.</text><text x="62" y="1211" style="font-size:16px;fill:#60728a">Source baseline 2026-09-08 · Evidence: architecture.md / capability-map.md</text></svg>
