<text x="60" y="73" style="font-size:44px;font-weight:700;fill:white">Neurath 하네스 구조</text>
<text x="62" y="120" style="font-size:23px;fill:#c8d7e9">의도를 연결하고, 권한을 확인하고, 실행 근거를 보존합니다</text><text x="62" y="205" class="label">01  사용자와 프로젝트</text><rect x="60" y="223" width="430" height="130" rx="15" fill="#e8f1ff" stroke="#cfdae6"/><rect x="79" y="245" width="5" height="72" rx="2" fill="#486c9d"/><text x="100" y="262" class="head">현재 사용자 의도</text><text x="100" y="294" class="body">목표 · 제약 · 성공 기준</text><text x="100" y="322" class="body">프로젝트 지침과 승인</text><rect x="505" y="223" width="430" height="130" rx="15" fill="#e8f1ff" stroke="#cfdae6"/><rect x="524" y="245" width="5" height="72" rx="2" fill="#486c9d"/><text x="545" y="262" class="head">네이티브 호스트</text><text x="545" y="294" class="body">Codex · Claude Code</text><text x="545" y="322" class="body">실제 세션 · 턴 · 도구 이벤트</text><rect x="950" y="223" width="430" height="130" rx="15" fill="#e8f1ff" stroke="#cfdae6"/><rect x="969" y="245" width="5" height="72" rx="2" fill="#486c9d"/><text x="990" y="262" class="head">에이전트 판단</text><text x="990" y="294" class="body">맥락을 읽고 절차 선택</text><text x="990" y="322" class="body">승인 범위에서 실행과 후속 처리</text><path d="M720 359v20m-6-6 6 6 6-6" fill="none" stroke="#8399b0" stroke-width="2"/><text x="62" y="393" class="label">02  안내와 실행 경계</text><rect x="60" y="411" width="430" height="130" rx="15" fill="#e5f5ef" stroke="#cfdae6"/><rect x="79" y="433" width="5" height="72" rx="2" fill="#486c9d"/><text x="100" y="450" class="head">정책과 스킬</text><text x="100" y="482" class="body">의도 분류 · 작업 절차</text><text x="100" y="510" class="body">공개 스킬과 실행 계약</text><rect x="505" y="411" width="430" height="130" rx="15" fill="#e5f5ef" stroke="#cfdae6"/><rect x="524" y="433" width="5" height="72" rx="2" fill="#486c9d"/><text x="545" y="450" class="head">신원과 소유권</text><text x="545" y="482" class="body">SessionKernel · StateHandle</text><text x="545" y="510" class="body">호출 결속 · worktree 소유권</text><rect x="950" y="411" width="430" height="130" rx="15" fill="#e5f5ef" stroke="#cfdae6"/><rect x="969" y="433" width="5" height="72" rx="2" fill="#486c9d"/><text x="990" y="450" class="head">명명된 MCP 작업</text><text x="990" y="482" class="body">구조화 입력과 도메인 dispatch</text><text x="990" y="510" class="body">현재 정책에 따른 실행</text><path d="M720 547v20m-6-6 6 6 6-6" fill="none" stroke="#8399b0" stroke-width="2"/><text x="62" y="581" class="label">03  작업과 도메인 서비스</text><rect x="60" y="599" width="430" height="130" rx="15" fill="#eef0fc" stroke="#cfdae6"/><rect x="79" y="621" width="5" height="72" rx="2" fill="#486c9d"/><text x="100" y="638" class="head">상태와 변경</text><text x="100" y="670" class="body">단계 전이 · material action</text><text x="100" y="698" class="body">기준 상태 → 실행 결과 → 대조</text><rect x="505" y="599" width="430" height="130" rx="15" fill="#eef0fc" stroke="#cfdae6"/><rect x="524" y="621" width="5" height="72" rx="2" fill="#486c9d"/><text x="545" y="638" class="head">Provider와 메시지</text><text x="545" y="670" class="body">모델 계획 · 권한 승계 · 소유 연결</text><text x="545" y="698" class="body">영속 저장 → 전달 → ACK</text><rect x="950" y="599" width="430" height="130" rx="15" fill="#eef0fc" stroke="#cfdae6"/><rect x="969" y="621" width="5" height="72" rx="2" fill="#486c9d"/><text x="990" y="638" class="head">유지보수</text><text x="990" y="670" class="body">업데이트 · 보고 · 기여</text><text x="990" y="698" class="body">정확한 대상 · 사용자 선택 · 복구</text><path d="M720 735v20m-6-6 6 6 6-6" fill="none" stroke="#8399b0" stroke-width="2"/><text x="62" y="769" class="label">04  검증과 연속성</text><rect x="60" y="787" width="430" height="130" rx="15" fill="#fff2dc" stroke="#cfdae6"/><rect x="79" y="809" width="5" height="72" rx="2" fill="#486c9d"/><text x="100" y="826" class="head">독립 평가</text><text x="100" y="858" class="body">후보 · 소스 revision · 검토자</text><text x="100" y="886" class="body">보고 → 부모 소비 → 완료 조건</text><rect x="505" y="787" width="430" height="130" rx="15" fill="#fff2dc" stroke="#cfdae6"/><rect x="524" y="809" width="5" height="72" rx="2" fill="#486c9d"/><text x="545" y="826" class="head">맥락과 학습</text><text x="545" y="858" class="body">공유 기억 · Enclave · Graphify</text><text x="545" y="886" class="body">검증 → 시험 → 유지 또는 철회</text><rect x="950" y="787" width="430" height="130" rx="15" fill="#fff2dc" stroke="#cfdae6"/><rect x="969" y="809" width="5" height="72" rx="2" fill="#486c9d"/><text x="990" y="826" class="head">검증 범위</text><text x="990" y="858" class="body">배포 · 설치 · 테스트 · 실제 호스트</text><text x="990" y="886" class="body">각 결과가 증명하는 범위 구분</text><path d="M720 923v20m-6-6 6 6 6-6" fill="none" stroke="#8399b0" stroke-width="2"/><text x="62" y="957" class="label">05  저장과 배포</text><rect x="60" y="975" width="430" height="130" rx="15" fill="#ecf2f7" stroke="#cfdae6"/><rect x="79" y="997" width="5" height="72" rx="2" fill="#486c9d"/><text x="100" y="1014" class="head">대상 worktree</text><text x="100" y="1046" class="body">사용자 소스와 개발환경</text><text x="100" y="1074" class="body">project.json 문서·검사 연결</text><rect x="505" y="975" width="430" height="130" rx="15" fill="#ecf2f7" stroke="#cfdae6"/><rect x="524" y="997" width="5" height="72" rx="2" fill="#486c9d"/><text x="545" y="1014" class="head">비공개 로컬 기록</text><text x="545" y="1046" class="body">상태 · 메시지 · 기억 · 설치 이력</text><text x="545" y="1074" class="body">출처와 소유권이 있는 기록</text><rect x="950" y="975" width="430" height="130" rx="15" fill="#ecf2f7" stroke="#cfdae6"/><rect x="969" y="997" width="5" height="72" rx="2" fill="#486c9d"/><text x="990" y="1014" class="head">독립 패키지</text><text x="990" y="1046" class="body">자체 실행 자산 · SHA-256 manifest</text><text x="990" y="1074" class="body">보존적 설치 · 저널 · 복구</text><path d="M60 1150h1320" stroke="#ccd6e2"/><text x="62" y="1181" class="body">책임을 요약한 개념도입니다. 배치는 프로세스나 호출 순서를 뜻하지 않습니다.</text><text x="62" y="1211" style="font-size:16px;fill:#60728a">소스 기준 2026-09-08 · 상세 근거: architecture.md / capability-map.md</text></svg>
