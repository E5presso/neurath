<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc" xml:lang="ko">
<title id="title">Neurath 하네스 구조</title><desc id="desc">의도를 연결하고, 권한을 확인하고, 실행 근거를 보존합니다. 책임을 요약한 개념도입니다. 배치는 프로세스나 호출 순서를 뜻하지 않습니다.</desc>
